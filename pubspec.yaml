name: app_casamento
description: "Aplicativo de gestão e check-in de casamento com funcionamento online e offline."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Comunicação com o banco de dados online.
  supabase_flutter: ^2.12.4

  # Gerenciamento de estado já utilizado pelo projeto.
  provider: ^6.1.5+1

  # Fontes utilizadas pela interface.
  google_fonts: ^8.1.0

  # Banco de dados SQLite local e reativo.
  drift: ^2.34.1
  drift_flutter: ^0.3.1

  # Detecta alterações na conexão de rede.
  connectivity_plus: ^7.2.0

  # Cria identificadores únicos enquanto o aparelho está offline.
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geradores necessários para criar o código do banco Drift.
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true