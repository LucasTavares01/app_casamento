name: app_casamento
description: "ConfirmaAi: gestão e check-in de eventos com funcionamento online e offline."
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Comunicação com o banco de dados online.
  supabase_flutter: ^2.12.4

  # Gerenciamento de estado já utilizado pelo projeto.
  provider: ^6.1.5+1

  # Fontes utilizadas pela interface.
  google_fonts: ^8.1.0

  # Banco de dados SQLite local e reativo.
  drift: ^2.34.1
  drift_flutter: ^0.3.1

  # Detecta alterações na conexão de rede.
  connectivity_plus: ^7.2.0

  # Cria identificadores únicos enquanto o aparelho está offline.
  uuid: ^4.5.3

  excel: ^4.0.6

  share_plus: ^11.1.0

  # Abre o fluxo OAuth no navegador externo no celular.
  url_launcher: ^6.3.2

  cross_file: ^0.3.5+4

  # Seleciona PDF, Excel, CSV ou imagens para pré-visualização da lista.
  file_picker: ^11.0.2

  # Permite fotografar uma lista diretamente pela câmera do celular.
  image_picker: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geradores necessários para criar o código do banco Drift.
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/confirmaai_icon.png

dependency_overrides:
  path_provider_android: 2.2.23
